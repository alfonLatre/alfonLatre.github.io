<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¡Feliz cumpleaños Pedro! 🎉</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Trebuchet MS", Arial, sans-serif;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #ff6ec4, #7873f5, #4ade80, #facc15);
      background-size: 400% 400%;
      animation: fondo 12s ease infinite;
      overflow-x: hidden;
    }
    @keyframes fondo { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

    canvas#confeti { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

    main { position: relative; z-index: 2; padding: 2rem 1rem 4rem; }
    h1 {
      font-size: clamp(2rem, 8vw, 5rem);
      margin: 1rem 0;
      text-shadow: 3px 3px 0 rgba(0,0,0,.25);
      animation: latido 1.5s ease-in-out infinite;
    }
    @keyframes latido { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    .emojis { font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: .5rem; }

    .video {
      max-width: 800px; margin: 2rem auto 0;
      border: 6px solid #fff; border-radius: 16px; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      aspect-ratio: 16 / 9; background: #000;
    }
    .video iframe, .video video { width: 100%; height: 100%; border: 0; display: block; }

    .globo {
      position: fixed; bottom: -80px; font-size: 3rem; z-index: 0;
      animation: subir linear forwards;
    }
    @keyframes subir { to { transform: translateY(-120vh) rotate(20deg); } }
  </style>
</head>
<body>
  <canvas id="confeti"></canvas>

  <main>
    <div class="emojis">🎈🎂🎁🥳🎊</div>
    <h1>¡FELIZ CUMPLEAÑOS PEDRO!</h1>
    <div class="emojis">🎉🍰🎶🎈🎉</div>

    <div class="video">
      <!-- OPCIÓN A: vídeo de YouTube (cambia VIDEO_ID) -->
      <iframe src="https://www.youtube.com/embed/VIDEO_ID"
              title="Vídeo de cumpleaños" allowfullscreen
              allow="accelerometer; autoplay; encrypted-media; picture-in-picture"></iframe>

      <!-- OPCIÓN B: vídeo propio (borra el iframe de arriba y descomenta esto)
      <video controls playsinline src="{{ '/assets/video/pedro.mp4' | relative_url }}"></video>
      -->
    </div>
  </main>

  <script>
    // Confeti
    const c = document.getElementById('confeti'), ctx = c.getContext('2d');
    function ajustar(){ c.width = innerWidth; c.height = innerHeight; }
    ajustar(); addEventListener('resize', ajustar);
    const colores = ['#ff0054','#ffbd00','#00f5d4','#9b5de5','#ffffff','#3a86ff'];
    const piezas = Array.from({length: 150}, () => nueva(true));
    function nueva(inicio){
      return { x: Math.random()*innerWidth,
               y: inicio ? Math.random()*innerHeight : -10,
               r: 4 + Math.random()*6,
               vy: 1 + Math.random()*3,
               vx: -1 + Math.random()*2,
               color: colores[Math.floor(Math.random()*colores.length)],
               giro: Math.random()*Math.PI };
    }
    (function dibujar(){
      ctx.clearRect(0,0,c.width,c.height);
      piezas.forEach((p,i) => {
        p.y += p.vy; p.x += p.vx; p.giro += .1;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.giro);
        ctx.fillStyle = p.color; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);
        ctx.restore();
        if (p.y > c.height + 10) piezas[i] = nueva(false);
      });
      requestAnimationFrame(dibujar);
    })();

    // Globos que suben
    const globos = ['🎈','🎈','🎈','🎉','🎊'];
    setInterval(() => {
      const g = document.createElement('div');
      g.className = 'globo';
      g.textContent = globos[Math.floor(Math.random()*globos.length)];
      g.style.left = Math.random()*95 + 'vw';
      g.style.animationDuration = (6 + Math.random()*6) + 's';
      document.body.appendChild(g);
      setTimeout(() => g.remove(), 13000);
    }, 600);
  </script>
</body>
</html>
